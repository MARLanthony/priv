# ============================================================================
# JurisFlow · Supabase local development
# ----------------------------------------------------------------------------
# Used by `supabase start` (Docker). The API URL and anon/service keys printed by
# `supabase start` go into:
#
#   database/supabase/.env   → SUPABASE_URL / SUPABASE_SERVICE_KEY (backend)
#   frontend/.env            → VITE_API_BASE_URL + VITE_SUPABASE_* (optional)
# ============================================================================

project_id = "jurisflow"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:4173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[analytics]
enabled = false

# The migrations and seeders in ../migrations and ../seeders are applied by
# `supabase db reset` (see database/README.md for the psql-only path).
